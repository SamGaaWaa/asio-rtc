<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>asiortc recorder</title>
    <style>
        body {
            font-family: monospace;
            background: #111;
            color: #eee;
            margin: 20px
        }

        video {
            width: 480px;
            background: #222;
            border: 1px solid #444
        }

        h3 {
            margin: 0 0 10px
        }

        #log {
            margin-top: 10px;
            padding: 8px;
            background: #1a1a1a;
            max-height: 150px;
            overflow-y: auto;
            font-size: 12px;
            border: 1px solid #333
        }

        button {
            font-family: monospace;
            font-size: 14px;
            padding: 8px 16px;
            margin: 10px 0;
            cursor: pointer
        }
    </style>
</head>

<body>
    <h3>asiortc recorder</h3>
    <video id="v" autoplay playsinline muted></video>
    <br>
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
    <pre id="log"></pre>
    <script>
        const log = document.getElementById('log');
        const v = document.getElementById('v');
        const startBtn = document.getElementById('start');
        const stopBtn = document.getElementById('stop');
        function L(m) { log.textContent += m + '\n'; log.scrollTop = log.scrollHeight }
        function T(s) { var d = new Date(); return d.getHours() + ':' + d.getMinutes() + ':' + d.getSeconds() + '.' + d.getMilliseconds() + ' ' + s; }

        let ws = null;
        let pc = null;
        let stream = null;

        async function begin() {
            L(T('Requesting camera...'));
            stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            v.srcObject = stream;

            ws = new WebSocket('ws://' + location.host + '/ws');
            pc = new RTCPeerConnection();

            pc.addTransceiver('video', { direction: 'sendonly' });
            pc.addTrack(stream.getVideoTracks()[0], stream);

            pc.oniceconnectionstatechange = () => L(T('ICE: ' + pc.iceConnectionState));
            pc.onconnectionstatechange = () => L(T('Conn: ' + pc.connectionState));

            ws.onopen = async () => {
                L(T('WS open, creating offer'));
                const o = await pc.createOffer();
                await pc.setLocalDescription(o);
                await new Promise(r => {
                    if (pc.iceGatheringState === 'complete') r();
                    else pc.addEventListener('icegatheringstatechange', function h() {
                        if (pc.iceGatheringState === 'complete') { pc.removeEventListener('icegatheringstatechange', h); r(); }
                    });
                });
                const full = pc.localDescription;
                L(T('Sending offer (' + full.sdp.split('\\r\\n').filter(l => l.startsWith('a=candidate')).length + ' cand)'));
                ws.send(JSON.stringify({ type: 'offer', sdp: full.sdp }));
                startBtn.disabled = true;
                stopBtn.disabled = false;
            };

            ws.onmessage = async e => {
                const m = JSON.parse(e.data);
                L(T('Got ' + m.type));
                await pc.setRemoteDescription(new RTCSessionDescription({ type: m.type, sdp: m.sdp }));
            };

            ws.onclose = () => {
                L(T('WS closed'));
                stopBtn.disabled = true;
                startBtn.disabled = false;
            };
        }

        startBtn.onclick = () => { begin().catch(e => L('FATAL: ' + e)); };

        stopBtn.onclick = () => {
            L(T('Stopping...'));
            if (ws && ws.readyState === WebSocket.OPEN)
                ws.send(JSON.stringify({ type: 'stop' }));
            if (pc) pc.close();
            if (stream) { stream.getTracks().forEach(t => t.stop()); v.srcObject = null; }
            if (ws) ws.close();
        };
    </script>
</body>
</html>
