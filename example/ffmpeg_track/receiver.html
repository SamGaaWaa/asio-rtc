<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>asiortc ffmpeg_track — Browser Receiver</title>
<style>
  body { font-family: monospace; background: #111; color: #eee; margin: 20px; }
  video { width: 640px; background: #222; border: 1px solid #444; }
  #log { margin-top: 10px; padding: 8px; background: #1a1a1a; max-height: 200px;
         overflow-y: auto; font-size: 12px; border: 1px solid #333; }
  .err { color: #f66; }
</style>
</head>
<body>
<h3>asiortc ffmpeg_track — Browser Receiver</h3>
<video id="video" autoplay playsinline></video>
<pre id="log"></pre>

<script>
const log = document.getElementById('log');
const video = document.getElementById('video');

function L(msg) {
  log.textContent += msg + '\n';
  log.scrollTop = log.scrollHeight;
}

async function main() {
  const ws = new WebSocket('ws://localhost:8086/ws');
  L('Connecting to signaling server...');

  const pc = new RTCPeerConnection({
    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
  });

  pc.ontrack = (event) => {
    L('Remote track: ' + event.track.kind + ' (' + event.streams.length + ' streams)');
    video.srcObject = event.streams[0];
  };

  pc.oniceconnectionstatechange = () => {
    L('ICE state: ' + pc.iceConnectionState);
  };

  pc.onconnectionstatechange = () => {
    L('Connection state: ' + pc.connectionState);
  };

  ws.onopen = async () => {
    L('WebSocket connected, waiting for offer...');
  };

  ws.onmessage = async (e) => {
    const msg = JSON.parse(e.data);
    L('Got ' + msg.type + ', SDP length=' + msg.sdp.length);

    await pc.setRemoteDescription(
      new RTCSessionDescription({ type: msg.type, sdp: msg.sdp }));

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    ws.send(JSON.stringify({ type: 'answer', sdp: answer.sdp }));
    L('Sent answer');
  };

  ws.onclose = () => L('WebSocket closed');
  ws.onerror = () => L('WebSocket error');
}

main().catch(e => L('FATAL: ' + e));
</script>
</body>
</html>
